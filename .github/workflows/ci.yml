name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore PaperProductTool.sln --configfile NuGet.Config
      - run: dotnet test tests/Paper.Api.Tests/Paper.Api.Tests.csproj --no-restore -c Release
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: dotnet publish backend/Paper.Api --no-restore -c Release -o publish
