name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore PaperProductTool.sln --configfile NuGet.Config
      - run: dotnet test tests/Paper.Api.Tests/Paper.Api.Tests.csproj --no-restore -c Release
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: dotnet publish backend/Paper.Api --no-restore -c Release -o publish
      - name: Build deployment image
        run: docker build -t paper-product-tool:ci .
      - name: Verify container startup and frontend
        run: |
          docker run --detach --name paper-smoke -p 127.0.0.1:10000:10000 paper-product-tool:ci
          trap 'docker logs paper-smoke; docker rm -f paper-smoke' EXIT
          curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:10000/healthz
          curl --fail http://127.0.0.1:10000/ | grep 'id="root"'
