name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore PaperProductTool.sln --configfile NuGet.Config
      - run: dotnet test tests/Paper.Api.Tests/Paper.Api.Tests.csproj --no-restore -c Release
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: dotnet publish backend/Paper.Api --no-restore -c Release -o publish
      - name: Build deployment image
        run: docker build -t paper-product-tool:ci .
      - name: Verify container startup and frontend
        run: |
          docker run --detach --name paper-smoke -e RENDER=true -e Database__AllowEphemeralSqlite=true -e PORT=10001 -p 127.0.0.1:10000:10001 paper-product-tool:ci
          trap 'docker logs paper-smoke; docker rm -f paper-smoke' EXIT
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors --retry-max-time 60 http://127.0.0.1:10000/healthz
          curl --fail http://127.0.0.1:10000/ | grep 'id="root"'
          curl --fail -H 'X-Forwarded-Proto: https' http://127.0.0.1:10000/api/auth/csrf | grep '"token"'
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAPER_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=integration-only;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PaperProductTool.sln --configfile NuGet.Config
      - run: dotnet test tests/Paper.Api.Tests --no-restore -c Release
